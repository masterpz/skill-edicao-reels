<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/700.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute;left:0;top:0}
.big{font-family:'Inter',sans-serif;font-weight:900;letter-spacing:-.04em;line-height:.95}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.box{position:absolute;overflow:hidden}
.box img{position:absolute;left:0;top:0;transform-origin:0 0}
.cap{position:absolute;left:40px;width:1000px;text-align:center;font-family:'Inter',sans-serif;font-weight:900;font-size:88px;line-height:1.14;letter-spacing:-.02em;text-transform:uppercase;z-index:50;transform-origin:50% 50%}
.cap span{display:inline-block;margin:0 5px;padding:0 15px 8px;border-radius:18px;color:#fff;-webkit-text-stroke:15px #000;paint-order:stroke fill}
.cap span.on{background:#FFD23F;color:#111;-webkit-text-stroke:0;box-shadow:0 9px 0 #000}
.win{position:absolute;background:rgba(18,18,20,.94);border:2px solid rgba(255,255,255,.16);border-radius:28px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.win .tb{height:60px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;padding:0 22px;font-family:'JetBrains Mono',monospace;font-size:21px;color:#a8a49c;white-space:nowrap;overflow:hidden}
.win .tb i{width:15px;height:15px;border-radius:50%;display:block;flex:none}
#preload{position:absolute;left:-3000px;top:0}
</style></head>
<body>
<div id="preload"><span style="font-weight:400">a</span><span style="font-weight:600">a</span><span style="font-weight:800">a</span><span class="big">AÇÃO</span><span class="mono">ab</span><span class="mono" style="font-weight:700">ab</span></div>
<div id="stage"></div>
<script src="core.js"></script>
<script src="styles/negocios.js"></script>
<script src="styles/ranking.js"></script>
<script src="styles/profundidade.js"></script>
<script src="styles/grade.js"></script>
<script src="styles/painel.js"></script>
<script src="styles/pessoal.js"></script>
<script>document.fonts.ready.then(()=>{window.MOTOR_PRONTO=true})</script>
</body></html>
